name: biblioteca_udc
description: PDF library organised with the free UDC Summary (Windows and Android client).
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  path: ^1.9.0
  file_picker: ^10.3.7
  open_filex: ^4.5.0

dependency_overrides:
  path_provider_android: 2.2.23

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
